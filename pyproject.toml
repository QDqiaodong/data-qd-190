[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "data-qd-190"
version = "0.1.0"
description = "摊牌牌力与边池筹码结算"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
showdown-pots = "showdown_pots.cli:main"
showdown-ledger = "showdown_pots.ledger_cli:main"
showdown-audit = "showdown_pots.audit_cli:main"
showdown-reconcile = "showdown_pots.reconcile_cli:main"
showdown-corpus = "showdown_pots.corpus_cli:main"
showdown-replay = "showdown_pots.replay_cli:main"
showdown-trace = "showdown_pots.trace_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
